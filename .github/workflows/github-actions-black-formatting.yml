name: black
on: pull_request

permissions:
  contents: read

jobs:
  black:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install black==24.2.0
      - run: |
          python -m black --check --verbose .
